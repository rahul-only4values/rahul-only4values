<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><rect width="900" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="24" y="36" font-size="17" font-weight="700" class="" text-anchor="start" >AI-built redesigns all look alike. I measured how much.</text><text x="24" y="56" font-size="12" font-weight="400" class="mut" text-anchor="start" >First-screen screenshots, embedded and compared; fonts and layouts fingerprinted from the page itself.</text><circle cx="120" cy="176" r="62" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="120" cy="176" r="62" fill="none" stroke="url(#gl)" stroke-width="16" stroke-linecap="round" stroke-dasharray="222.0 389.6" transform="rotate(-90 120 176)"/><text x="120" y="184" font-size="30" font-weight="800" class="" text-anchor="middle" >57%</text><text x="24" y="258" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >of previews had a same-</text><text x="24" y="273" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >template look-alike</text><text x="300" y="112" font-size="12" font-weight="600" class="" text-anchor="start" >One heading font on</text><rect x="430" y="98" width="150" height="20" rx="5" fill="var(--line)"/><rect class="bh" x="430" y="98" width="66" height="20" rx="5" fill="var(--em)" style="animation-delay:0.0s"/><text x="590" y="113" font-size="12" font-weight="800" class="" text-anchor="start" >44%</text><text x="300" y="152" font-size="12" font-weight="600" class="" text-anchor="start" >One body font on</text><rect x="430" y="138" width="150" height="20" rx="5" fill="var(--line)"/><rect class="bh" x="430" y="138" width="75" height="20" rx="5" fill="var(--em2)" style="animation-delay:0.1s"/><text x="590" y="153" font-size="12" font-weight="800" class="" text-anchor="start" >50%</text><text x="300" y="192" font-size="12" font-weight="600" class="" text-anchor="start" >Three fonts cover</text><rect x="430" y="178" width="150" height="20" rx="5" fill="var(--line)"/><rect class="bh" x="430" y="178" width="88" height="20" rx="5" fill="var(--teal)" style="animation-delay:0.2s"/><text x="590" y="193" font-size="12" font-weight="800" class="" text-anchor="start" >59%</text><text x="300" y="226" font-size="10" font-weight="400" class="m mut" text-anchor="start" >of previews, of headings</text><text x="690" y="98" font-size="12" font-weight="700" class="" text-anchor="start" >Top font share</text><text x="690" y="114" font-size="10.5" font-weight="400" class="mut" text-anchor="start" >of one batch of previews</text><text x="690" y="132" font-size="10.5" font-weight="400" class="mut" text-anchor="start" >earlier batch</text><rect class="bh" x="690" y="138" width="147" height="18" rx="5" fill="var(--mut)" fill-opacity=".7"/><text x="845.0" y="152" font-size="12" font-weight="800" class="" text-anchor="start" >49%</text><text x="690" y="174" font-size="10.5" font-weight="400" class="mut" text-anchor="start" >later batch, after the fix</text><rect class="bh" x="690" y="180" width="66" height="18" rx="5" fill="url(#gl)" style="animation-delay:.2s"/><text x="764.0" y="194" font-size="12" font-weight="800" class="" text-anchor="start" >22%</text><text x="690" y="224" font-size="11" font-weight="400" class="mut" text-anchor="start" >No single trait explained it.</text><text x="690" y="239" font-size="11" font-weight="400" class="mut" text-anchor="start" >Layout, heading font,</text><text x="690" y="254" font-size="11" font-weight="400" class="mut" text-anchor="start" >transparent nav and palette</text><text x="690" y="269" font-size="11" font-weight="400" class="mut" text-anchor="start" >stacked up.</text><text x="24" y="300" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >What it changed: a quality bar before scale. Cap any one font, ban the named default habits, gate each build against recent ones.</text><text x="450" y="324" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >[M] my own sameness report, 5 Oct 2026. Similarity thresholds were set by eye on 7 pairs.</text></svg>