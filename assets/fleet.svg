<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><style>.p{animation:pl 2.6s ease-in-out infinite}@keyframes pl{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}</style><rect width="900" height="350" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="26" y="38" font-size="19" font-weight="800" class="" text-anchor="start" >One operator, an agent fleet, and one job that stays mine</text><text x="26" y="58" font-size="12.5" font-weight="400" class="mut" text-anchor="start" >A company does five things: sense, execute, remember, report, decide. Four of them can be automated. Deciding cannot.</text><line x1="200" y1="205" x2="200" y2="100" stroke="var(--line)" stroke-dasharray="3 4"/><rect x="148" y="80" width="104" height="40" rx="10" fill="var(--bg2)" stroke="var(--line)"/><text x="200" y="97" font-size="12.5" font-weight="700" class="" text-anchor="middle" >Sense</text><text x="200" y="112" font-size="9.5" font-weight="400" class="mut" text-anchor="middle" >what is happening</text><line x1="200" y1="205" x2="300" y2="173" stroke="var(--line)" stroke-dasharray="3 4"/><rect x="248" y="153" width="104" height="40" rx="10" fill="var(--bg2)" stroke="var(--line)"/><text x="300" y="170" font-size="12.5" font-weight="700" class="" text-anchor="middle" >Execute</text><text x="300" y="185" font-size="9.5" font-weight="400" class="mut" text-anchor="middle" >do the work</text><line x1="200" y1="205" x2="262" y2="290" stroke="var(--line)" stroke-dasharray="3 4"/><rect x="210" y="270" width="104" height="40" rx="10" fill="var(--bg2)" stroke="var(--line)"/><text x="262" y="287" font-size="12.5" font-weight="700" class="" text-anchor="middle" >Remember</text><text x="262" y="302" font-size="9.5" font-weight="400" class="mut" text-anchor="middle" >keep the record</text><line x1="200" y1="205" x2="138" y2="290" stroke="var(--line)" stroke-dasharray="3 4"/><rect x="86" y="270" width="104" height="40" rx="10" fill="var(--bg2)" stroke="var(--line)"/><text x="138" y="287" font-size="12.5" font-weight="700" class="" text-anchor="middle" >Report</text><text x="138" y="302" font-size="9.5" font-weight="400" class="mut" text-anchor="middle" >show me</text><circle class="p" cx="200" cy="205" r="46" fill="var(--card)" stroke="var(--em)" stroke-width="3"/><text x="200" y="203" font-size="15" font-weight="800" class="em" text-anchor="middle" >Decide</text><text x="200" y="219" font-size="10.5" font-weight="600" class="mut" text-anchor="middle" >only me</text><text x="26" y="322" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >Automate the four, deliver a ranked queue of</text><text x="26" y="338" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >decisions. Throughput is decisions per day times the</text><text x="26" y="354" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >quality of each.</text><g class="t" style="animation-delay:0.0s"><rect x="420" y="84" width="454" height="32" rx="8" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="436" y="105" font-size="11" font-weight="800" class="m em" text-anchor="start" >L5</text><text x="476" y="105" font-size="13" font-weight="700" class="" text-anchor="start" >Views</text><text x="600" y="105" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >generated, never maintained</text></g><g class="t" style="animation-delay:0.08s"><rect x="420" y="124" width="454" height="32" rx="8" fill="none" stroke="var(--em)" stroke-width="2"/><text x="436" y="145" font-size="11" font-weight="800" class="m em" text-anchor="start" >L4</text><text x="476" y="145" font-size="13" font-weight="700" class="" text-anchor="start" >Attention router</text><text x="600" y="145" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >a ranked queue of what needs me</text></g><g class="t" style="animation-delay:0.16s"><rect x="420" y="164" width="454" height="32" rx="8" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="436" y="185" font-size="11" font-weight="800" class="m em" text-anchor="start" >L3</text><text x="476" y="185" font-size="13" font-weight="700" class="" text-anchor="start" >Departments</text><text x="600" y="185" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >standing agents on a cadence</text></g><g class="t" style="animation-delay:0.24s"><rect x="420" y="204" width="454" height="32" rx="8" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="436" y="225" font-size="11" font-weight="800" class="m em" text-anchor="start" >L2</text><text x="476" y="225" font-size="13" font-weight="700" class="" text-anchor="start" >Index</text><text x="600" y="225" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >filled in automatically, nothing typed</text></g><g class="t" style="animation-delay:0.32s"><rect x="420" y="244" width="454" height="32" rx="8" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="436" y="265" font-size="11" font-weight="800" class="m em" text-anchor="start" >L1</text><text x="476" y="265" font-size="13" font-weight="700" class="" text-anchor="start" >Capture</text><text x="600" y="265" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >zero-friction inbox</text></g><g class="t" style="animation-delay:0.4s"><rect x="420" y="284" width="454" height="32" rx="8" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="436" y="305" font-size="11" font-weight="800" class="m em" text-anchor="start" >L0</text><text x="476" y="305" font-size="13" font-weight="700" class="" text-anchor="start" >Reality</text><text x="600" y="305" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >the real systems, never replaced</text></g><text x="420" y="330" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >Keep the systems, add a thin index, put agents on a cadence.</text><text x="420" y="346" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >Buy tools that do things, not tools that hold data.</text><text x="450" y="372" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >My design note, Aug 2026. Parts are built (the cockpit, the ledger, the index); the whole is not finished.</text></svg>