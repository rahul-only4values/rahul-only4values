<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900" height="322" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><g transform="translate(0,0)"><g class="t" style="animation-delay:0.0s"><rect width="288" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="288" height="5" rx="2" fill="var(--em)"/><text x="20" y="40" font-size="16" font-weight="800" class="" text-anchor="start" >Doing now</text><circle cx="26" cy="60" r="3.5" fill="var(--em)"/><text x="40" y="64" font-size="12" font-weight="400" class="" text-anchor="start" >Website-quality judge: validate</text><text x="40" y="80" font-size="12" font-weight="400" class="" text-anchor="start" >the two-stage cascade on fresh</text><text x="40" y="96" font-size="12" font-weight="400" class="" text-anchor="start" >sites with a stricter human</text><text x="40" y="112" font-size="12" font-weight="400" class="" text-anchor="start" >reference</text><circle cx="26" cy="146" r="3.5" fill="var(--em)"/><text x="40" y="150" font-size="12" font-weight="400" class="" text-anchor="start" >Design diversity: a gate so one</text><text x="40" y="166" font-size="12" font-weight="400" class="" text-anchor="start" >batch cannot repeat the same fonts</text><text x="40" y="182" font-size="12" font-weight="400" class="" text-anchor="start" >and layouts</text><circle cx="26" cy="216" r="3.5" fill="var(--em)"/><text x="40" y="220" font-size="12" font-weight="400" class="" text-anchor="start" >IDX: a cockpit for Claude Code and</text><text x="40" y="236" font-size="12" font-weight="400" class="" text-anchor="start" >Gemini CLI sessions, in closed</text><text x="40" y="252" font-size="12" font-weight="400" class="" text-anchor="start" >beta</text></g></g><g transform="translate(300,0)"><g class="t" style="animation-delay:0.12s"><rect width="288" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="288" height="5" rx="2" fill="var(--teal)"/><text x="20" y="40" font-size="16" font-weight="800" class="" text-anchor="start" >Next</text><circle cx="26" cy="60" r="3.5" fill="var(--teal)"/><text x="40" y="64" font-size="12" font-weight="400" class="" text-anchor="start" >Truthfulness: push invented claims</text><text x="40" y="80" font-size="12" font-weight="400" class="" text-anchor="start" >per AI-built page below the 4.5</text><text x="40" y="96" font-size="12" font-weight="400" class="" text-anchor="start" >median</text><circle cx="26" cy="130" r="3.5" fill="var(--teal)"/><text x="40" y="134" font-size="12" font-weight="400" class="" text-anchor="start" >A small-vision-model toolkit:</text><text x="40" y="150" font-size="12" font-weight="400" class="" text-anchor="start" >which questions it answers</text><text x="40" y="166" font-size="12" font-weight="400" class="" text-anchor="start" >reliably, which it does not</text><circle cx="26" cy="200" r="3.5" fill="var(--teal)"/><text x="40" y="204" font-size="12" font-weight="400" class="" text-anchor="start" >Cost per task for agent work, with</text><text x="40" y="220" font-size="12" font-weight="400" class="" text-anchor="start" >short-context sessions as the</text><text x="40" y="236" font-size="12" font-weight="400" class="" text-anchor="start" >lever</text></g></g><g transform="translate(600,0)"><g class="t" style="animation-delay:0.24s"><rect width="288" height="290" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="288" height="5" rx="2" fill="var(--mut)"/><text x="20" y="40" font-size="16" font-weight="800" class="" text-anchor="start" >Parked on purpose</text><circle cx="26" cy="60" r="3.5" fill="var(--mut)"/><text x="40" y="64" font-size="12" font-weight="400" class="" text-anchor="start" >Local-model batching for a</text><text x="40" y="80" font-size="12" font-weight="400" class="" text-anchor="start" >mixture-of-experts model:</text><text x="40" y="96" font-size="12" font-weight="400" class="" text-anchor="start" >measured, did not help</text><circle cx="26" cy="130" r="3.5" fill="var(--mut)"/><text x="40" y="134" font-size="12" font-weight="400" class="" text-anchor="start" >Rule-based detection of dated</text><text x="40" y="150" font-size="12" font-weight="400" class="" text-anchor="start" >sites: HTML signals do not</text><text x="40" y="166" font-size="12" font-weight="400" class="" text-anchor="start" >reproduce what a designer calls</text><text x="40" y="182" font-size="12" font-weight="400" class="" text-anchor="start" >dated</text><circle cx="26" cy="216" r="3.5" fill="var(--mut)"/><text x="40" y="220" font-size="12" font-weight="400" class="" text-anchor="start" >Anything that needs a bigger</text><text x="40" y="236" font-size="12" font-weight="400" class="" text-anchor="start" >sample before I will quote it</text></g></g><text x="450" y="314" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >Real items from my own notes, 19 Oct 2026. Status is mine, not a benchmark.</text></svg>