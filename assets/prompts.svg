<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><rect width="900" height="310" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="24" y="36" font-size="17" font-weight="700" class="" text-anchor="start" >Prompting a small image model: the intuitive moves failed</text><text x="24" y="56" font-size="12" font-weight="400" class="mut" text-anchor="start" >A tiny typed-decision model judging 100 random sites. How the question is asked mattered more than how much is asked.</text><text x="24" y="96" font-size="12" font-weight="700" class="" text-anchor="start" >Ranking power (AUC)</text><line x1="123" x2="123" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="122.85714285714289" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.4</text><line x1="186" x2="186" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="185.71428571428572" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.5</text><line x1="249" x2="249" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="248.57142857142858" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.6</text><line x1="311" x2="311" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="311.42857142857144" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.7</text><line x1="374" x2="374" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="374.2857142857143" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.8</text><line x1="437" x2="437" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="437.1428571428572" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >0.9</text><line x1="500" x2="500" y1="112" y2="232" stroke="var(--line)" stroke-dasharray="2 5"/><text x="500.0" y="250" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >1.0</text><text x="24" y="134" font-size="12" font-weight="600" class="" text-anchor="start" >Eleven narrow design-symptom questions</text><rect class="bh" x="123" y="142" width="176" height="22" rx="6" fill="var(--teal)" fill-opacity=".85"/><text x="306.8571428571429" y="158" font-size="12" font-weight="700" class="" text-anchor="start" >0.40 to 0.68</text><text x="24" y="196" font-size="12" font-weight="600" class="" text-anchor="start" >One holistic question</text><rect class="bh" x="60" y="204" width="402" height="22" rx="6" fill="url(#gl)" style="animation-delay:.2s"/><text x="470.2857142857143" y="220" font-size="12" font-weight="700" class="" text-anchor="start" >0.94</text><rect x="540" y="80" width="336" height="42" rx="10" fill="none" stroke="var(--line)"/><text x="554" y="98" font-size="12" font-weight="700" class="" text-anchor="start" >Long 'judge by today's standards' checklist</text><text x="554" y="114" font-size="11" font-weight="400" class="mut" text-anchor="start" >made it call almost everything dated (accuracy 0.36 to 0.40)</text><rect x="540" y="128" width="336" height="42" rx="10" fill="none" stroke="var(--line)"/><text x="554" y="146" font-size="12" font-weight="700" class="" text-anchor="start" >Order of the answer options</text><text x="554" y="162" font-size="11" font-weight="400" class="mut" text-anchor="start" >alone moved accuracy 0.62 to 0.69. Average both orders.</text><rect x="540" y="176" width="336" height="42" rx="10" fill="none" stroke="var(--line)"/><text x="554" y="194" font-size="12" font-weight="700" class="" text-anchor="start" >Few-shot image examples</text><text x="554" y="210" font-size="11" font-weight="400" class="mut" text-anchor="start" >no gain at five times the cost</text><rect x="540" y="224" width="336" height="42" rx="10" fill="none" stroke="var(--line)"/><text x="554" y="242" font-size="12" font-weight="700" class="" text-anchor="start" >Quarter-resolution images</text><text x="554" y="258" font-size="11" font-weight="400" class="mut" text-anchor="start" >kept ranking power near 0.9 at about a third of the cost</text><text x="24" y="284" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >Result: use it as a free first pass, never the only judge. Send the unsure middle band to a stronger one.</text><text x="450" y="324" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >[N] from my research notes, 19 Oct 2026. One reviewer's reference labels, tuned on the same 100 sites: treat as indicative.</text></svg>