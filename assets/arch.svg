<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--em)"/></marker></defs><style>.fl{stroke-dasharray:6 6;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-12}}</style><text x="0" y="22" font-size="17" font-weight="700">How IDX is put together</text><text x="0" y="42" font-size="12" class="mut">From the repository README. A local daemon owns the state; the UI and each AI tool plug into it.</text><rect x="0" y="92" width="150" height="86" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><text x="75.0" y="132.0" text-anchor="middle" font-size="14" font-weight="700">Renderer</text><text x="75.0" y="151.0" text-anchor="middle" font-size="11" class="m mut">React · 4K-first</text><rect x="185" y="92" width="150" height="86" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><text x="260.0" y="132.0" text-anchor="middle" font-size="14" font-weight="700">Desktop shell</text><text x="260.0" y="151.0" text-anchor="middle" font-size="11" class="m mut">Electron · macOS</text><rect x="370" y="70" width="220" height="130" rx="12" fill="var(--card)" stroke="var(--em)" stroke-width="2"/><text x="480" y="104" text-anchor="middle" font-size="14" font-weight="700">Host daemon</text><text x="480" y="124" text-anchor="middle" font-size="11" class="m mut">Node · SQLite</text><text x="480" y="156" text-anchor="middle" font-size="11" class="m em">JSON-RPC over WebSocket</text><text x="480" y="176" text-anchor="middle" font-size="11" class="m mut">sessions survive restarts</text><line class="fl" x1="153" y1="135" x2="182" y2="135" stroke="var(--em)" stroke-width="2" marker-end="url(#a)"/><line class="fl" x1="338" y1="135" x2="367" y2="135" stroke="var(--em)" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="62" width="250" height="54" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><text x="775.0" y="86.0" text-anchor="middle" font-size="14" font-weight="700">Claude Agent SDK</text><text x="775.0" y="105.0" text-anchor="middle" font-size="11" class="m mut">adapter-claude</text><line class="fl" x1="593" y1="135" x2="647" y2="89" stroke="var(--em)" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="126" width="250" height="54" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><text x="775.0" y="150.0" text-anchor="middle" font-size="14" font-weight="700">Gemini via ACP</text><text x="775.0" y="169.0" text-anchor="middle" font-size="11" class="m mut">adapter-gemini</text><line class="fl" x1="593" y1="135" x2="647" y2="153" stroke="var(--em)" stroke-width="2" marker-end="url(#a)"/><rect x="650" y="190" width="250" height="54" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><text x="775.0" y="214.0" text-anchor="middle" font-size="14" font-weight="700">Terminal</text><text x="775.0" y="233.0" text-anchor="middle" font-size="11" class="m mut">PTY · find · file links</text><line class="fl" x1="593" y1="135" x2="647" y2="217" stroke="var(--em)" stroke-width="2" marker-end="url(#a)"/><text x="775" y="266" text-anchor="middle" font-size="11" class="mut">your own CLIs and accounts, never shared</text><rect x="0" y="296" width="117" height="28" rx="14" fill="none" stroke="var(--line)"/><text x="58" y="315" text-anchor="middle" font-size="11" class="m">protocol · zod</text><rect x="127" y="296" width="247" height="28" rx="14" fill="none" stroke="var(--line)"/><text x="250" y="315" text-anchor="middle" font-size="11" class="m">tokens · OKLCH with contrast tests</text><rect x="384" y="296" width="182" height="28" rx="14" fill="none" stroke="var(--line)"/><text x="475" y="315" text-anchor="middle" font-size="11" class="m">approvals · trust levels</text><rect x="576" y="296" width="150" height="28" rx="14" fill="none" stroke="var(--line)"/><text x="651" y="315" text-anchor="middle" font-size="11" class="m">per-project windows</text><text x="0" y="356" font-size="12" class="mut">pnpm workspace: apps/host, apps/desktop, apps/renderer; packages: protocol, adapter-claude, adapter-gemini, tokens, pty</text><text x="0" y="388" font-size="10" class="m mut">[M] quoted from the emberyard/idx README, 19 Oct 2026. IDX is a working name; closed beta.</text></svg>