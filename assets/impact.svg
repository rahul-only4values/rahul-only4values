</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><g transform="translate(0,0)"><g class="t" style="animation-delay:0.0s"><rect width="210" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="62" font-size="40" font-weight="800" fill="url(#gl)" letter-spacing="-1">97 → 86%</text><text x="18" y="88" font-size="13" font-weight="600" class="" text-anchor="start" >A small test said 97%.</text><text x="18" y="106" font-size="13" font-weight="600" class="" text-anchor="start" >Fresh sites said about</text><text x="18" y="124" font-size="13" font-weight="600" class="" text-anchor="start" >86%.</text><text x="18" y="156" font-size="10" class="m mut">website-quality judge · [N]</text></g></g><g transform="translate(225,0)"><g class="t" style="animation-delay:0.12s"><rect width="210" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="62" font-size="40" font-weight="800" fill="url(#gl)" letter-spacing="-1">57%</text><text x="18" y="88" font-size="13" font-weight="600" class="" text-anchor="start" >of AI-built redesigns had</text><text x="18" y="106" font-size="13" font-weight="600" class="" text-anchor="start" >a same-template look-</text><text x="18" y="124" font-size="13" font-weight="600" class="" text-anchor="start" >alike.</text><text x="18" y="156" font-size="10" class="m mut">design sameness study · [M]</text></g></g><g transform="translate(450,0)"><g class="t" style="animation-delay:0.24s"><rect width="210" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="62" font-size="40" font-weight="800" fill="url(#gl)" letter-spacing="-1">9 → 4.5</text><text x="18" y="88" font-size="13" font-weight="600" class="" text-anchor="start" >invented claims per AI-</text><text x="18" y="106" font-size="13" font-weight="600" class="" text-anchor="start" >built page (median), after</text><text x="18" y="124" font-size="13" font-weight="600" class="" text-anchor="start" >a better brief.</text><text x="18" y="156" font-size="10" class="m mut">truthfulness audit · [M]</text></g></g><g transform="translate(675,0)"><g class="t" style="animation-delay:0.36s"><rect width="210" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="62" font-size="40" font-weight="800" fill="url(#gl)" letter-spacing="-1">80%</text><text x="18" y="88" font-size="13" font-weight="600" class="" text-anchor="start" >of my agent spend was</text><text x="18" y="106" font-size="13" font-weight="600" class="" text-anchor="start" >subagents, not my own</text><text x="18" y="124" font-size="13" font-weight="600" class="" text-anchor="start" >sessions.</text><text x="18" y="156" font-size="10" class="m mut">usage study · [M]</text></g></g><text x="450" y="196" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >[M] measured, source file kept. [N] from my own research notes; the raw files were not re-opened for this page.</text></svg>