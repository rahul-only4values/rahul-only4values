<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><rect x="0" y="0" width="288" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="20" y="44" font-size="30" font-weight="800" fill="url(#gl)">01</text><text x="20" y="74" font-size="16" font-weight="700">Measure, don't guess</text><text x="20" y="100" font-size="12.5" class="mut">Every number I publish carries a tag:</text><text x="20" y="119" font-size="12.5" class="mut">measured, derived or unverified. If I</text><text x="20" y="138" font-size="12.5" class="mut">can't source it, it doesn't ship.</text><rect x="300" y="0" width="288" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="320" y="44" font-size="30" font-weight="800" fill="url(#gl)">02</text><text x="320" y="74" font-size="16" font-weight="700">Agents write, I direct</text><text x="320" y="100" font-size="12.5" class="mut">A fleet of coding agents does the</text><text x="320" y="119" font-size="12.5" class="mut">typing. I set direction, review the work</text><text x="320" y="138" font-size="12.5" class="mut">and own every outcome.</text><rect x="600" y="0" width="288" height="176" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="620" y="44" font-size="30" font-weight="800" fill="url(#gl)">03</text><text x="620" y="74" font-size="16" font-weight="700">Research before tooling</text><text x="620" y="100" font-size="12.5" class="mut">Before building agent tooling I surveyed</text><text x="620" y="119" font-size="12.5" class="mut">358 existing repos and wrote down what</text><text x="620" y="138" font-size="12.5" class="mut">was worth using.</text></svg>