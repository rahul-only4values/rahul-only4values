<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style><g transform="translate(0,0)"><g class="t" style="animation-delay:0.0s"><rect x="0" y="0" width="210" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/><rect x="0" y="0" width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="66" font-size="52" font-weight="800" fill="url(#gl)" letter-spacing="-1">29</text><text x="18" y="92" font-size="13.5" font-weight="600">IDX releases in 8 days</text><text x="18" y="112" font-size="11.5" class="mut">signed · notarized · auto-update</text><text x="18" y="134" font-size="10" class="m mut">v0.1.0 → v0.1.28, 11–18 Oct</text><text x="192" y="22" text-anchor="end" font-size="9.5" class="m em">[M]</text></g></g><g transform="translate(225,0)"><g class="t" style="animation-delay:0.12s"><rect x="0" y="0" width="210" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/><rect x="0" y="0" width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="66" font-size="52" font-weight="800" fill="url(#gl)" letter-spacing="-1">722</text><text x="18" y="92" font-size="13.5" font-weight="600">IDX commits in 10 days</text><text x="18" y="112" font-size="11.5" class="mut">ticket key on every commit</text><text x="18" y="134" font-size="10" class="m mut">10–19 Oct 2026</text><text x="192" y="22" text-anchor="end" font-size="9.5" class="m em">[M]</text></g></g><g transform="translate(450,0)"><g class="t" style="animation-delay:0.24s"><rect x="0" y="0" width="210" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/><rect x="0" y="0" width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="66" font-size="52" font-weight="800" fill="url(#gl)" letter-spacing="-1">690</text><text x="18" y="92" font-size="13.5" font-weight="600">Yantra commits, 6 months</text><text x="18" y="112" font-size="11.5" class="mut">predecessor, 42 public releases</text><text x="18" y="134" font-size="10" class="m mut">14 Mar–29 Sep 2026</text><text x="192" y="22" text-anchor="end" font-size="9.5" class="m em">[M]</text></g></g><g transform="translate(675,0)"><g class="t" style="animation-delay:0.36s"><rect x="0" y="0" width="210" height="150" rx="14" fill="var(--card)" stroke="var(--line)"/><rect x="0" y="0" width="210" height="4" rx="2" fill="url(#gl)"/><text x="18" y="66" font-size="52" font-weight="800" fill="url(#gl)" letter-spacing="-1">358</text><text x="18" y="92" font-size="13.5" font-weight="600">agent repos surveyed</text><text x="18" y="112" font-size="11.5" class="mut">finding: over-tooled, not under</text><text x="18" y="134" font-size="10" class="m mut">forge sweep, 28 Aug</text><text x="192" y="22" text-anchor="end" font-size="9.5" class="m em">[M]</text></g></g><text x="450" y="166" text-anchor="middle" font-size="10" class="m mut">[M] measured live from the GitHub API on 19 Oct 2026. Commits are agent-written under my direction; they show cadence, not quality.</text></svg>