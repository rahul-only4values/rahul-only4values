<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><rect width="900" height="300" rx="14" fill="var(--card)" stroke="var(--line)"/><text x="24" y="36" font-size="17" font-weight="700" class="" text-anchor="start" >A small test flattered the judge</text><text x="24" y="56" font-size="12" font-weight="400" class="mut" text-anchor="start" >Can a vision model tell a dated small-business website from a modern one? Accuracy against a human-checked reference.</text><line x1="360.0" x2="360.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="360.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >50%</text><line x1="454.0" x2="454.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="454.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >60%</text><line x1="548.0" x2="548.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="548.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >70%</text><line x1="642.0" x2="642.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="642.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >80%</text><line x1="736.0" x2="736.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="736.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >90%</text><line x1="830.0" x2="830.0" y1="82" y2="240" stroke="var(--line)" stroke-dasharray="2 5"/><text x="830.0" y="256" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >100%</text><text x="24" y="109" font-size="12.5" font-weight="600" class="" text-anchor="start" >First test · 34 sites · best judge</text><rect class="bh" x="360" y="92" width="442" height="24" rx="6" fill="var(--teal)" fill-opacity="0.9" style="animation-delay:0.0s"/><text x="809.8" y="109" font-size="13" font-weight="800" class="" text-anchor="start" >97%</text><text x="845.8" y="109" font-size="10" font-weight="400" class="m mut" text-anchor="start" >[M]</text><text x="24" y="145" font-size="12.5" font-weight="600" class="" text-anchor="start" >Fresh sites · best open judge</text><rect class="bh" x="360" y="128" width="338" height="24" rx="6" fill="var(--em)" fill-opacity="0.9" style="animation-delay:0.12s"/><text x="706.4" y="145" font-size="13" font-weight="800" class="" text-anchor="start" >86%</text><text x="742.4" y="145" font-size="10" font-weight="400" class="m mut" text-anchor="start" >[N]</text><text x="24" y="181" font-size="12.5" font-weight="600" class="" text-anchor="start" >Fresh sites · hosted judge</text><rect class="bh" x="360" y="164" width="329" height="24" rx="6" fill="var(--em2)" fill-opacity="0.9" style="animation-delay:0.24s"/><text x="697.0" y="181" font-size="13" font-weight="800" class="" text-anchor="start" >85%</text><text x="733.0" y="181" font-size="10" font-weight="400" class="m mut" text-anchor="start" >[N]</text><text x="24" y="217" font-size="12.5" font-weight="600" class="" text-anchor="start" >Two-stage cascade, tuned on same sample</text><rect class="bh" x="360" y="200" width="385" height="24" rx="6" fill="var(--em)" fill-opacity="0.45" style="animation-delay:0.36s"/><text x="753.4" y="217" font-size="13" font-weight="800" class="" text-anchor="start" >91%</text><text x="789.4" y="217" font-size="10" font-weight="400" class="m mut" text-anchor="start" >[N]</text><path d="M802 80 V70 H698 V80" fill="none" stroke="var(--em)" stroke-width="1.5"/><text x="750.0999999999999" y="64" font-size="11" font-weight="700" class="em" text-anchor="middle" >−11 points</text><text x="24" y="276" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >What I took from it: a result on a small test is a hypothesis. Validate on fresh data before any big run. Treat the</text><text x="24" y="292" font-size="11.5" font-weight="400" class="mut" text-anchor="start" >cascade's 91% as optimistic.</text><text x="450" y="314" font-size="10" font-weight="400" class="m mut" text-anchor="middle" >[M] 34-site bake-off results file. [N] fresh-site and cascade numbers from my research notes, 4 Oct 2026; raw files not re-opened.</text></svg>