<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img"><style>
svg{--bg1:#fff6ee;--bg2:#ffffff;--card:#ffffff;--line:#e7d9cc;--fg:#1f2328;--mut:#6b7280;--em:#e8590c;--em2:#f59f00;--teal:#0f9d9a;--grid:#00000010;}
@media (prefers-color-scheme: dark){svg{--bg1:#0b0f17;--bg2:#161b26;--card:#141a25;--line:#2a3344;--fg:#e8edf5;--mut:#8b96a8;--em:#ff7a3d;--em2:#ffc34d;--teal:#3ddbd9;--grid:#ffffff0d;}}
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)} .m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:var(--mut)} .em{fill:var(--em)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient><linearGradient id="gv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--em)"/><stop offset="1" stop-color="var(--em2)"/></linearGradient></defs><style>.t{animation:up .8s ease-out both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.bh{transform-box:fill-box;transform-origin:left;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style><style>.fl{stroke-dasharray:5 5;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-10}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--em)"/></marker></defs><rect width="900" height="216" rx="14" fill="var(--card)" stroke="var(--line)"/><rect width="6" height="216" rx="3" fill="url(#gl)"/><text x="26" y="36" font-size="19" font-weight="800" class="" text-anchor="start" >AI dubbing, end to end</text><text x="874" y="34" font-size="10.5" font-weight="400" class="m mut" text-anchor="end" >Dubmate · 2023 to now</text><g class="t" style="animation-delay:0.0s"><rect x="26" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="88" y="72" font-size="11.5" font-weight="600" class="" text-anchor="middle" >Listen</text></g><line class="fl" x1="153" y1="76" x2="169" y2="76" stroke="var(--em)" stroke-width="1.6" marker-end="url(#a)"/><g class="t" style="animation-delay:0.08s"><rect x="172" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="234" y="72" font-size="11.5" font-weight="600" class="" text-anchor="middle" >Translate</text></g><line class="fl" x1="298" y1="76" x2="314" y2="76" stroke="var(--em)" stroke-width="1.6" marker-end="url(#a)"/><g class="t" style="animation-delay:0.16s"><rect x="317" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="379" y="72" font-size="11.5" font-weight="600" class="" text-anchor="middle" >New voice</text></g><line class="fl" x1="444" y1="76" x2="460" y2="76" stroke="var(--em)" stroke-width="1.6" marker-end="url(#a)"/><g class="t" style="animation-delay:0.24s"><rect x="463" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="525" y="72" font-size="11.5" font-weight="600" class="" text-anchor="middle" >Keep the music</text></g><line class="fl" x1="590" y1="76" x2="606" y2="76" stroke="var(--em)" stroke-width="1.6" marker-end="url(#a)"/><g class="t" style="animation-delay:0.32s"><rect x="609" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--teal)" stroke-width="2"/><text x="671" y="72" font-size="11.5" font-weight="700" class="" text-anchor="middle" >Fit the video</text></g><line class="fl" x1="735" y1="76" x2="751" y2="76" stroke="var(--em)" stroke-width="1.6" marker-end="url(#a)"/><g class="t" style="animation-delay:0.4s"><rect x="754" y="54" width="124" height="44" rx="10" fill="var(--bg2)" stroke="var(--line)" stroke-width="1"/><text x="816" y="72" font-size="11.5" font-weight="600" class="" text-anchor="middle" >Final cut</text></g><text x="26" y="128" font-size="10" font-weight="700" class="m em" text-anchor="start" >THE HARD PART</text><text x="26" y="144" font-size="12.5" font-weight="400" class="" text-anchor="start" >A translated line rarely takes the same time as</text><text x="26" y="161" font-size="12.5" font-weight="400" class="" text-anchor="start" >the original, so dubs sound rushed or drift out of</text><text x="26" y="178" font-size="12.5" font-weight="400" class="" text-anchor="start" >sync.</text><text x="462" y="128" font-size="10" font-weight="700" class="m em" text-anchor="start" >THE IDEA</text><text x="462" y="144" font-size="12.5" font-weight="400" class="" text-anchor="start" >Adjust the video to fit the new voice, instead of</text><text x="462" y="161" font-size="12.5" font-weight="400" class="" text-anchor="start" >squeezing the voice into the video.</text><text x="26" y="206" font-size="10.5" font-weight="400" class="m mut" text-anchor="start" >It worked and never found paying customers. It grew into the research library above.</text></svg>